{% extends "layout.html" %}

{% block content %}
    <div class="container">
        <!-- 页面标题和操作按钮 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary mb-0">
                <i class="bi bi-building me-2"></i>
                部门管理中心
            </h2>
            <div class="btn-group" role="group">
                <a class="btn btn-success btn-lg" href="/depart/add/">
                    <i class="bi bi-plus-circle me-2"></i>
                    新建部门
                </a>
            </div>
        </div>

        <!-- 文件上传区域 -->
        <div class="card shadow-lg border-0 mb-4">
            <div class="card-header bg-gradient text-white" style="background: linear-gradient(135deg, #17a2b8 0%, #6610f2 100%);">
                <h5 class="mb-0">
                    <i class="bi bi-file-earmark-arrow-up me-2"></i>
                    Excel文件上传
                </h5>
            </div>
            <div class="card-body">
                <form method="post" action="/depart/multi/" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row align-items-end">
                        <div class="col-md-8">
                            <div class="form-group mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-file-excel me-1"></i>选择Excel文件
                                </label>
                                <input type="file" name="upload_file_excel" class="form-control form-control-lg" accept=".xlsx,.xls">
                                <div class="form-text">
                                    <i class="bi bi-info-circle me-1"></i>
                                    支持 .xlsx 和 .xls 格式文件
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-info btn-lg w-100">
                                <i class="bi bi-upload me-2"></i>
                                开始上传
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 部门列表 -->
        <div class="card shadow-lg border-0 mb-4">
            <div class="card-header bg-gradient text-white d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #fd7e14 0%, #e83e8c 100%);">
                <h5 class="mb-0">
                    <i class="bi bi-list-ul me-2"></i>
                    部门列表
                </h5>
                <span class="badge bg-light text-dark fs-6">
                    共 {{ queryset|length }} 个部门
                </span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col" class="text-center">
                                <i class="bi bi-hash me-1"></i>ID
                            </th>
                            <th scope="col">
                                <i class="bi bi-building me-1"></i>部门名称
                            </th>
                            <th scope="col" class="text-center">
                                <i class="bi bi-gear me-1"></i>操作
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        {% for obj in queryset %}
                            <tr class="align-middle">
                                <td class="text-center fw-bold text-primary">{{ obj.id }}</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="dept-icon me-3">
                                            <i class="bi bi-building-fill"></i>
                                        </div>
                                        <div>
                                            <span class="fw-semibold fs-5">{{ obj.title }}</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <a class="btn btn-outline-primary btn-sm" href="/depart/{{ obj.id }}/edit/" title="编辑部门">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <a class="btn btn-outline-danger btn-sm" href="/depart/delete/?nid={{ obj.id }}" title="删除部门">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-light">
                <ul class="pagination justify-content-center mb-0">
                    {{ page_string }}
                </ul>
            </div>
        </div>

     </div>
 {% endblock %}
 
 {% block css %}
     <style>
         .btn-success {
             background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
             border: none;
             transition: all 0.3s ease;
         }
         
         .btn-success:hover {
             background: linear-gradient(135deg, #218838 0%, #1ea085 100%);
             transform: translateY(-2px);
             box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
         }
         
         .btn-info {
             background: linear-gradient(135deg, #17a2b8 0%, #6610f2 100%);
             border: none;
             transition: all 0.3s ease;
         }
         
         .btn-info:hover {
             background: linear-gradient(135deg, #138496 0%, #5a0fc8 100%);
             transform: translateY(-2px);
             box-shadow: 0 4px 12px rgba(23, 162, 184, 0.3);
         }
         
         .dept-icon {
             width: 48px;
             height: 48px;
             border-radius: 12px;
             background: linear-gradient(135deg, #fd7e14 0%, #e83e8c 100%);
             display: flex;
             align-items: center;
             justify-content: center;
             color: white;
             font-size: 20px;
         }
         
         .form-control:focus {
             border-color: #17a2b8;
             box-shadow: 0 0 0 0.2rem rgba(23, 162, 184, 0.25);
         }
         
         .table tbody tr:hover {
             background-color: rgba(253, 126, 20, 0.05);
             transform: translateY(-1px);
             transition: all 0.2s ease;
         }
         
         .btn-group .btn {
             transition: all 0.2s ease;
         }
         
         .btn-group .btn:hover {
             transform: translateY(-2px);
             box-shadow: 0 4px 8px rgba(0,0,0,0.15);
         }
         
         .card {
             transition: all 0.3s ease;
         }
         
         .card:hover {
             transform: translateY(-2px);
             box-shadow: 0 8px 25px rgba(0,0,0,0.15) !important;
         }
         
         .pagination .page-link {
             border: none;
             margin: 0 2px;
             border-radius: 8px;
             color: #fd7e14;
         }
         
         .pagination .page-item.active .page-link {
             background: linear-gradient(135deg, #fd7e14 0%, #e83e8c 100%);
             border: none;
         }
         
         .pagination .page-link:hover {
             background-color: rgba(253, 126, 20, 0.1);
             color: #fd7e14;
         }
         
         .form-label {
             font-weight: 600;
             color: #495057;
         }
         
         .badge {
             font-size: 0.75rem;
             padding: 0.5em 0.75em;
         }
     </style>
 {% endblock %}
