{% extends 'layout.html' %}

{% block content %}
<div class="container-fluid px-4">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-lg-6 col-md-8">
            <div class="error-container text-center">
                <!-- 错误图标 -->
                <div class="error-icon mb-4">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                </div>
                
                <!-- 错误标题 -->
                <h2 class="error-title text-danger mb-3">
                    <i class="bi bi-x-circle me-2"></i>
                    操作失败
                </h2>
                
                <!-- 错误消息卡片 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <div class="alert alert-danger border-0 mb-0" role="alert">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-info-circle-fill me-3" style="font-size: 1.5rem;"></i>
                                <div class="text-start">
                                    <h6 class="alert-heading mb-2">错误详情</h6>
                                    <p class="mb-0">{{ msg }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="error-actions">
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-arrow-left me-2"></i>
                            返回上页
                        </button>
                        <a href="/index/" class="btn btn-primary btn-lg">
                            <i class="bi bi-house-door me-2"></i>
                            返回首页
                        </a>
                        <button onclick="location.reload()" class="btn btn-outline-info btn-lg">
                            <i class="bi bi-arrow-clockwise me-2"></i>
                            重新加载
                        </button>
                    </div>
                </div>
                
                <!-- 帮助提示 -->
                <div class="help-section mt-5">
                    <div class="card border-0 bg-light">
                        <div class="card-body p-3">
                            <h6 class="card-title text-muted mb-2">
                                <i class="bi bi-lightbulb me-2"></i>
                                需要帮助？
                            </h6>
                            <p class="card-text small text-muted mb-0">
                                如果问题持续存在，请联系系统管理员或查看帮助文档。
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* 错误页面样式 */
.error-container {
    animation: fadeInUp 0.6s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.error-icon {
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
    100% {
        transform: scale(1);
    }
}

.error-title {
    font-weight: 600;
    letter-spacing: -0.5px;
}

/* 按钮悬停效果 */
.btn:hover {
    transform: translateY(-2px);
    transition: all 0.3s ease;
}

.btn-primary {
    background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
    border: none;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #0b5ed7 0%, #0a58ca 100%);
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
}

.btn-outline-secondary:hover {
    background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
    border-color: #6c757d;
    color: white;
    box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
}

.btn-outline-info:hover {
    background: linear-gradient(135deg, #0dcaf0 0%, #0bb5d6 100%);
    border-color: #0dcaf0;
    color: white;
    box-shadow: 0 4px 12px rgba(13, 202, 240, 0.3);
}

/* 卡片悬停效果 */
.card:hover {
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    transition: box-shadow 0.3s ease;
}

/* 警告框样式 */
.alert-danger {
    background: linear-gradient(135deg, #f8d7da 0%, #f1aeb5 100%);
    color: #721c24;
}

/* 响应式调整 */
@media (max-width: 768px) {
    .error-icon i {
        font-size: 3rem !important;
    }
    
    .error-title {
        font-size: 1.5rem;
    }
    
    .d-flex.gap-3 {
        flex-direction: column;
    }
    
    .btn-lg {
        width: 100%;
        margin-bottom: 0.5rem;
    }
    
    .container-fluid {
        padding-left: 1rem;
        padding-right: 1rem;
    }
}

/* 帮助区域样式 */
.help-section .card {
    border-radius: 0.75rem;
}

.help-section .card-body {
    border-radius: 0.75rem;
}
</style>
{% endblock %}
