{% extends "layout.html" %}

{% block content %}
<div class="container-fluid px-4">
    <!-- 面包屑导航 -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/index/"><i class="bi bi-house-door"></i> 首页</a></li>
            <li class="breadcrumb-item"><a href="/depart/list/">部门管理</a></li>
            <li class="breadcrumb-item active" aria-current="page">编辑部门</li>
        </ol>
    </nav>

    <!-- 页面标题 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">
            <i class="bi bi-pencil-square text-primary me-2"></i>
            编辑部门
        </h2>
    </div>

    <!-- 表单卡片 -->
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-gradient-primary text-white">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-building me-2"></i>
                        部门信息
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="title" class="form-label fw-bold">
                                <i class="bi bi-tag me-1"></i>
                                部门名称
                            </label>
                            <input type="text" 
                                   id="title"
                                   name="title" 
                                   class="form-control form-control-lg" 
                                   value="{{ row_list.title }}"
                                   placeholder="请输入部门名称"
                                   required>
                            <div class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                请输入准确的部门名称
                            </div>
                        </div>

                        <div class="d-flex gap-3 justify-content-end">
                            <a href="/depart/list/" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-arrow-left me-2"></i>
                                返回列表
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle me-2"></i>
                                保存修改
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* 表单控件焦点效果 */
.form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
}

/* 按钮悬停效果 */
.btn:hover {
    transform: translateY(-1px);
    transition: all 0.2s ease;
}

/* 卡片悬停效果 */
.card:hover {
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    transition: box-shadow 0.3s ease;
}

/* 面包屑样式 */
.breadcrumb {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
}

.breadcrumb-item a {
    color: #6c757d;
    text-decoration: none;
}

.breadcrumb-item a:hover {
    color: #0d6efd;
}

/* 表单标签样式 */
.form-label {
    color: #495057;
    margin-bottom: 0.5rem;
}

/* 表单提示文字 */
.form-text {
    color: #6c757d;
    font-size: 0.875rem;
}

/* 渐变背景 */
.bg-gradient-primary {
    background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%);
}

/* 响应式调整 */
@media (max-width: 768px) {
    .container-fluid {
        padding-left: 1rem;
        padding-right: 1rem;
    }
    
    .d-flex.gap-3 {
        flex-direction: column;
    }
    
    .btn-lg {
        width: 100%;
    }
}
</style>
{% endblock %}
