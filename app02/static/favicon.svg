<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f37c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- 商业图标 - 建筑物 -->
  <rect x="8" y="12" width="16" height="12" fill="#ffffff" rx="1"/>
  <rect x="10" y="14" width="2" height="2" fill="#4361ee"/>
  <rect x="13" y="14" width="2" height="2" fill="#4361ee"/>
  <rect x="16" y="14" width="2" height="2" fill="#4361ee"/>
  <rect x="19" y="14" width="2" height="2" fill="#4361ee"/>
  
  <rect x="10" y="17" width="2" height="2" fill="#4361ee"/>
  <rect x="13" y="17" width="2" height="2" fill="#4361ee"/>
  <rect x="16" y="17" width="2" height="2" fill="#4361ee"/>
  <rect x="19" y="17" width="2" height="2" fill="#4361ee"/>
  
  <rect x="10" y="20" width="2" height="2" fill="#4361ee"/>
  <rect x="13" y="20" width="2" height="2" fill="#4361ee"/>
  <rect x="16" y="20" width="2" height="2" fill="#4361ee"/>
  <rect x="19" y="20" width="2" height="2" fill="#4361ee"/>
  
  <!-- 顶部装饰 -->
  <rect x="6" y="10" width="20" height="2" fill="#ffffff" rx="1"/>
  
  <!-- 中文"商"字简化设计 -->
  <text x="16" y="9" font-family="Microsoft YaHei, sans-serif" font-size="6" fill="#ffffff" text-anchor="middle" font-weight="bold">商</text>
</svg>